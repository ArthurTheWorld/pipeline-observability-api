name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: Validar manifestos do Kubernetes (sem cluster)
        run: kubernetes-validate -k 1.34 --strict deploy/k8s/*.yaml
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pipeline-observability-api:ci .
      - name: Subir o contêiner e bater nas sondas
        run: |
          docker run -d --name api -p 8000:8000 -e API_KEYS='{"ci":{"sha256":"00","role":"viewer"}}' pipeline-observability-api:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/ready && break; sleep 1; done
          curl -fs localhost:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/v1/overview)" = 401
