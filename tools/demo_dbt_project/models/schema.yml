version: 2
sources:
  - name: raw
    schema: raw
    tables:
      - name: fresh_orders
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 72, period: hour}
      - name: warning_orders
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 720, period: hour}
      - name: stale_orders
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 72, period: hour}

models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [paid, pending]
  - name: fct_orders
    columns:
      - name: order_id
        data_tests: [unique]
