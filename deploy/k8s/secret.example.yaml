# EXEMPLO. Não commite a versão real. Gere o hash com:  python -m obs_api new-key --name grafana --role viewer
# e crie o Secret direto no cluster:  kubectl -n obs-api create secret generic obs-api-keys --from-literal=API_KEYS='{...}'
apiVersion: v1
kind: Secret
metadata:
  name: obs-api-keys
  namespace: obs-api
type: Opaque
stringData:
  API_KEYS: '{"grafana": {"sha256": "TROQUE_PELO_HASH", "role": "viewer"}}'
